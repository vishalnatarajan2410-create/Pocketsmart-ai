<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: #f8fafc;">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <i class="fa-solid fa-wallet text-sky-400"></i>
      <span>Pocket<span class="logo-smart">Smart</span></span>
    </a>
    <div class="nav-actions">
      <a href="/register" class="btn-nav-signup">Create Account</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-brand">PocketSmart</h1>
        <p class="auth-subtitle" style="font-weight: 600; color: #64748b;">AI-Powered Budget Planning</p>
        <h2 class="auth-title">Welcome Back</h2>
      </div>

      {% if error %}
        <div class="alert-error">
          <i class="fa-solid fa-circle-exclamation" style="margin-right: 0.4rem;"></i> {{ error }}
        </div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
          </div>
          <div style="text-align: right; margin-top: 0.4rem;">
            <a href="#" style="font-size: 0.8rem; color: #64748b;">Forgot Password?</a>
          </div>
        </div>

        <button type="submit" class="btn-submit-action" style="margin-top: 1.5rem;">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create Account</a>
      </div>

      <!-- Quick demo login hint -->
      <div style="margin-top: 1.5rem; padding: 0.75rem; background: #eff6ff; border-radius: 8px; font-size: 0.8rem; color: #1e40af; text-align: left;">
        <strong><i class="fa-solid fa-key"></i> Quick Demo Login:</strong><br>
        Username: <code>sai</code> or <code>admin</code><br>
        Password: <code>password123</code> or <code>admin123</code>
      </div>
    </div>
  </div>

</body>
</html>
