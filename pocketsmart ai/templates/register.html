<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: #f8fafc;">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <i class="fa-solid fa-wallet text-sky-400"></i>
      <span>Pocket<span class="logo-smart">Smart</span></span>
    </a>
    <div class="nav-actions">
      <a href="/login" class="btn-nav-signin">Sign In</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-brand">PocketSmart</h1>
        <p class="auth-subtitle" style="font-weight: 600; color: #64748b;">AI-Powered Budget Planning</p>
        <h2 class="auth-title">Create Your Account</h2>
      </div>

      {% if error %}
        <div class="alert-error">
          <i class="fa-solid fa-circle-exclamation" style="margin-right: 0.4rem;"></i> {{ error }}
        </div>
      {% endif %}

      <form action="/register" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-circle-check"></i>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm your password" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn-submit-action" style="margin-top: 1.5rem;">
          Create Account <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign In</a>
      </div>
    </div>
  </div>

</body>
</html>
